name: Test scheduled lighting
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components/custom_lighting

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py

  home-assistant-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Import integration inside the exact target HA image
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD:/workspace:ro" -w /workspace
          ghcr.io/home-assistant/home-assistant:2026.10.4
          -c 'import importlib; [importlib.import_module("custom_components.custom_lighting" + suffix) for suffix in ("", ".switch", ".select", ".config_flow", ".frontend")]'
